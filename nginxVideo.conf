# Video2X Studio — video.thatinsaneguy.com
# Static UI from frontend/dist, API (+ uploads/downloads) proxied to FastAPI on 127.0.0.1:9281.
# deploy.sh rewrites the dist path and port; certbot adds the 443 server block.

server {
    listen 80;
    listen [::]:80;
    server_name video.thatinsaneguy.com;

    root /home/dedsec995/Desktop/video2x/frontend/dist;
    index index.html;

    # Large video uploads stream straight through to the API.
    client_max_body_size 4200m;

    location /api/ {
        proxy_pass http://127.0.0.1:9281;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
